{% extends "base.html" %}
{% block title %}Dashboard – IpRanger{% endblock %}

{% block content %}
<div class="space-y-6">

  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Live Connections</h1>
      <p class="text-sm text-gray-500 mt-0.5">Currently connected IPs, sorted by address — auto-refreshes every 10 s</p>
    </div>
  </div>

  <!-- Stats cards (auto-refresh) -->
  <div id="stats-cards"
       hx-get="/partials/stats-cards"
       hx-trigger="every 10s"
       hx-swap="outerHTML">
    {% include "partials/stats_cards.html" %}
  </div>

  <!-- Live IP table (auto-refresh) -->
  <div id="live-ips-wrap"
       hx-get="/partials/live-ips"
       hx-trigger="every 10s"
       hx-swap="outerHTML">
    {% include "partials/live_ips_table.html" %}
  </div>

</div>
{% endblock %}
