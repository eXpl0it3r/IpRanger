{% extends "base.html" %}
{% block title %}Logs – IpRanger{% endblock %}

{% block content %}
<div class="space-y-4">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Logs</h1>
      <p class="text-sm text-gray-500 mt-0.5">Live ring-buffer log viewer</p>
    </div>
    <button hx-post="/api/logs/clear"
            hx-target="#log-lines"
            hx-swap="innerHTML"
            class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm rounded-lg transition-colors">
      Clear
    </button>
  </div>

  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4">
    <div class="flex gap-3 flex-wrap">
      <select id="level-filter"
        class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"
        hx-get="/partials/logs"
        hx-trigger="change"
        hx-target="#log-lines"
        hx-swap="innerHTML"
        hx-include="#search-filter"
        name="level">
        <option value="">All levels</option>
        {% for lvl in levels %}
        <option value="{{ lvl }}" {% if level_filter == lvl %}selected{% endif %}>{{ lvl }}</option>
        {% endfor %}
      </select>
      <input id="search-filter" type="text" name="search" value="{{ search }}"
        placeholder="Filter by module..."
        class="flex-1 min-w-[200px] px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"
        hx-get="/partials/logs"
        hx-trigger="keyup changed delay:300ms"
        hx-target="#log-lines"
        hx-swap="innerHTML"
        hx-include="#level-filter" />
    </div>
  </div>

  <div id="log-lines" class="space-y-1">
    {% include "partials/log_lines.html" %}
  </div>
</div>
{% endblock %}
