{% if manual_blocks %}
<table class="w-full text-sm">
  <thead>
    <tr class="bg-gray-50 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">
      <th class="px-4 py-3">Entry</th>
      <th class="px-4 py-3">Type</th>
      <th class="px-4 py-3">Reason</th>
      <th class="px-4 py-3">Blocked At</th>
      <th class="px-4 py-3">Actions</th>
    </tr>
  </thead>
  <tbody class="divide-y divide-gray-100">
    {% for b in manual_blocks %}
    <tr class="hover:bg-gray-50 transition-colors">
      <td class="px-4 py-2 font-mono font-medium text-gray-800">{{ b.entry }}</td>
      <td class="px-4 py-2">
        <span class="px-1.5 py-0.5 rounded text-xs font-medium
          {% if b.entry_type == 'cidr' %}bg-purple-50 text-purple-700
          {% else %}bg-indigo-50 text-indigo-700{% endif %}">
          {{ b.entry_type }}
        </span>
      </td>
      <td class="px-4 py-2 text-gray-500 text-xs">{{ b.reason or '–' }}</td>
      <td class="px-4 py-2 text-gray-400 text-xs whitespace-nowrap">{{ (b.created_at or '')[:19] }}</td>
      <td class="px-4 py-2">
        <form hx-post="/api/unblock"
              hx-target="#manual-blocks-table"
              hx-swap="innerHTML">
          <input type="hidden" name="entry" value="{{ b.entry }}" />
          <button type="submit"
            class="px-2 py-1 text-xs font-medium bg-gray-100 hover:bg-gray-200 text-gray-700 rounded transition-colors">
            Unblock
          </button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="text-sm text-gray-400 italic py-2">No manual blocks configured.</p>
{% endif %}
