{% for r in records %}
<div class="font-mono text-xs px-4 py-1.5 rounded-lg
  {% if r.level == 'ERROR' or r.level == 'CRITICAL' %}bg-red-50 text-red-800
  {% elif r.level == 'WARNING' %}bg-yellow-50 text-yellow-800
  {% elif r.level == 'DEBUG' %}bg-gray-50 text-gray-500
  {% else %}bg-white text-gray-700{% endif %}
  border border-transparent hover:border-gray-200">
  <span class="text-gray-400">{{ r.time }}</span>
  <span class="font-semibold ml-2 {{ r.colour }}">{{ r.level }}</span>
  <span class="text-gray-400 ml-2">{{ r.name }}</span>
  <span class="ml-2">{{ r.message }}</span>
</div>
{% else %}
<div class="text-center text-gray-400 text-sm py-8">No log entries.</div>
{% endfor %}
