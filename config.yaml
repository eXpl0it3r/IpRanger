server:
  host: "0.0.0.0"
  port: 5000
  debug: false
  secret_key: "change-me-in-production"
  auth:
    enabled: true
    username: "admin"
    password: "change-me"

database:
  path: "ipranger.db"

monitoring:
  interval_seconds: 10

blocklists:
  update_interval_hours: 24
  sources:
    - name: "emerging_threats"
      url: "https://rules.emergingthreats.net/fwrules/emerging-Block-IPs.txt"
      type: "ip"
      enabled: true
    - name: "spamhaus_drop"
      url: "https://www.spamhaus.org/drop/drop.txt"
      type: "cidr"
      enabled: true
    - name: "cinsscore"
      url: "https://cinsscore.com/list/ci-badguys.txt"
      type: "ip"
      enabled: true

rdap:
  lookup_delay_seconds: 1

ipset:
  persist: true
